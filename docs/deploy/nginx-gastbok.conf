# /etc/nginx/sites-available/gastbok (symlinked into sites-enabled)
server {
    listen 80;
    server_name 192.168.68.168 rp58 rp58.local gastbok gastbok.local;

    client_max_body_size 20M;

    location /static/ {
        alias /srv/gastbok/current/staticfiles/;
    }

    location /media/ {
        alias /srv/gastbok/current/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
